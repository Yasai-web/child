<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>子育ておでかけリンク集</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  background: #f6f7f9;
}

/* ヘッダー */
header {
  background: #ff8aa5;
  color: white;
  padding: 16px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

/* タブ */
.tabs {
  display: flex;
  overflow-x: auto;
  background: white;
  border-bottom: 1px solid #ddd;
}

.tab {
  padding: 12px 16px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 14px;
  border-bottom: 3px solid transparent;
}

.tab.active {
  border-bottom: 3px solid #ff8aa5;
  font-weight: bold;
}

/* コンテンツ */
.container {
  padding: 12px;
  display: none;
}

.container.active {
  display: block;
}

/* カード */
.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.card .content {
  padding: 10px;
}

.card .title {
  font-weight: bold;
  margin-bottom: 6px;
}

.card .desc {
  font-size: 12px;
  color: #555;
}
</style>
</head>

<body>

<header>👶 子育ておでかけリンク集</header>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" onclick="showTab('care')">施設</div>
  <div class="tab" onclick="showTab('play')">遊び場</div>
  <div class="tab" onclick="showTab('park')">公園</div>
  <div class="tab" onclick="showTab('museum')">博物館</div>
  <div class="tab" onclick="showTab('other')">その他</div>
</div>

<!-- 施設 -->
<div id="care" class="container active">
  <div class="card">
    <img src="https://source.unsplash.com/800x400/?preschool" />
    <div class="content">
      <div class="title">たんぽぽ保育園</div>
      <div class="desc">地域密着型の保育園</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?kids,playroom" />
    <div class="content">
      <div class="title">キッズルーム</div>
      <div class="desc">雨の日でも遊べる室内空間</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?children,activity" />
    <div class="content">
      <div class="title">まちぷら</div>
      <div class="desc">地域交流型スペース</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?child,play" />
    <div class="content">
      <div class="title">こばとくらぶ</div>
      <div class="desc">幼児向けの遊び場</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?library,kids" />
    <div class="content">
      <div class="title">子育てひろば（西片・江戸川橋・汐見）</div>
      <div class="desc">親子でゆっくりできる場所</div>
    </div>
  </div>
</div>

<!-- 遊び場 -->
<div id="play" class="container">
  <div class="card">
    <img src="https://source.unsplash.com/800x400/?zoo,panda" />
    <div class="content">
      <div class="title">上野動物園</div>
      <div class="desc">パンダが人気の定番スポット</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?aquarium,jellyfish" />
    <div class="content">
      <div class="title">すみだ水族館</div>
      <div class="desc">幻想的な水族館</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?toy,museum" />
    <div class="content">
      <div class="title">東京おもちゃ美術館</div>
      <div class="desc">触って遊べる体験型施設</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?firetruck,museum" />
    <div class="content">
      <div class="title">消防博物館</div>
      <div class="desc">消防車や体験展示が人気</div>
    </div>
  </div>
</div>

<!-- 公園 -->
<div id="park" class="container">
  <div class="card">
    <img src="https://source.unsplash.com/800x400/?park,children" />
    <div class="content">
      <div class="title">新花公園</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?playground" />
    <div class="content">
      <div class="title">切通公園</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?sakura,park" />
    <div class="content">
      <div class="title">墨田公園</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?ueno,park" />
    <div class="content">
      <div class="title">上野公園</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?garden,park" />
    <div class="content">
      <div class="title">新宿御苑</div>
    </div>
  </div>
</div>

<!-- 博物館 -->
<div id="museum" class="container">
  <div class="card">
    <img src="https://source.unsplash.com/800x400/?museum,dinosaur" />
    <div class="content">
      <div class="title">東京科学博物館</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?museum,japan" />
    <div class="content">
      <div class="title">東京国立博物館</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?library,children" />
    <div class="content">
      <div class="title">国際子ども図書館</div>
    </div>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/800x400/?library,books" />
    <div class="content">
      <div class="title">湯島図書館</div>
    </div>
  </div>
</div>

<!-- その他 -->
<div id="other" class="container">
  <div class="card">
    <img src="https://source.unsplash.com/800x400/?river,tokyo" />
    <div class="content">
      <div class="title">神田川深水テラス</div>
    </div>
  </div>
</div>

<script>
function showTab(id){
  document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}
</script>

</body>
</html>
